[package]
name = "clipture"
version = "1.6.6"
description = "Low-footprint native host for Clipture"
authors = ["Clipture"]
edition = "2021"
rust-version = "1.91"

[lib]
name = "clipture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dev-dependencies]
webview2-com = "0.38.2"

[dev-dependencies]
minisign = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
base64 = "0.23"
minisign-verify = "0.2"
sha2 = "0.10"
semver = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "system-proxy"] }
dirs = "6"
# Friend-to-friend clip sharing: authenticated, end-to-end encrypted QUIC
# dialed by public key (see docs/adr/0011-p2p-clip-sharing.md).
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-mdns-address-lookup = "0.6"
blake3 = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["tray-icon", "protocol-asset", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11.0"

[target.'cfg(windows)'.dependencies]
auto-launch = "=0.5.0"
winreg = "=0.55.0"
png = "0.17"
windows = { version = "0.61", features = [
  "Wdk_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

# Dev builds keep line numbers for backtraces but skip full debug info, which
# is most of target/'s size; dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
