name: CI

# Tests every push to main and makes the release build once.
#
# release-build is the real signed NSIS build a release ships. It is kept as
# the `release-build` artifact; when a version tag points at a commit this
# workflow built and tested, release.yml publishes that artifact instead of
# compiling and testing the same commit again.
#
# Compiled dependencies are cached per Cargo.lock and Rust version. GitHub
# lets a tag's workflow read caches only from that tag or the default branch,
# so these caches, saved on main, are also what a release falls back to.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "engine/**"
      - "third_party/**"
      - "src/**"
      - "tools/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keyed on the engine's own sources: an unchanged engine is reused, not
      # rebuilt; it was built and tested when those sources last changed.
      - name: Reuse an engine built from these sources
        id: engine_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/engine/Release/clipture_engine.exe
          key: engine-${{ runner.os }}-${{ hashFiles('engine/**', 'third_party/**') }}

      - name: Build native capture engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        run: npm run build:engine

      - name: Test native capture engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        run: ctest --test-dir build/engine -C Release --output-on-failure

      - name: Hand the engine to the later jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipture-engine
          path: build/engine/Release/clipture_engine.exe
          if-no-files-found: error
          retention-days: 1

  rust-tests:
    needs: engine
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc

      # The compiled dependencies themselves, not only downloaded sources:
      # host build scripts and proc macros under target/debug, the test
      # build under the target triple.
      - name: Cache compiled test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/debug
            src-tauri/target/x86_64-pc-windows-msvc/debug
          key: cargo-test-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Get the capture engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clipture-engine
          path: build/engine/Release

      - name: Stage Tauri sidecars
        run: npm run stage:tauri

      - name: Test migration contracts
        run: |
          node scripts/migration/test-host-contract.cjs
          node scripts/migration/test-renderer-boundaries.cjs
          node scripts/migration/test-ui-process-boundaries.cjs
          node scripts/migration/test-save-result-contract.cjs
          node scripts/testing/test-tauri-workflow.cjs
          node scripts/migration/test-frame-diagnostics-parity.cjs
          node scripts/testing/test-library-snapshot.cjs
          node scripts/release/test-electron-bridge.cjs
          node scripts/release/test-production-key.cjs
          node scripts/release/test-runtime-manifest.cjs
          node scripts/release/test-installer-template.cjs
          node scripts/release/test-windows-runtime-imports.cjs

      - name: Test Rust host
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Test patch tool
        run: cargo test --locked --manifest-path tools/make-patches/Cargo.toml

  # The release build, exactly as a release ships it: same configuration,
  # native identity, updater signature and optional Authenticode signing.
  # It is the slowest job, so it waits for nothing: the engine comes from
  # the cache, or is built here when its sources changed (the engine job
  # tests it alongside).
  release-build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache compiled release dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/release
            src-tauri/target/x86_64-pc-windows-msvc/release
            !src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
          key: cargo-release-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Install dependencies
        run: npm ci

      - name: Reject development updater key
        run: node scripts/release/validate-production-key.cjs

      - name: Build renderer
        run: npm run build:renderer

      - name: Reuse an engine built from these sources
        id: engine_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/engine/Release/clipture_engine.exe
          key: engine-${{ runner.os }}-${{ hashFiles('engine/**', 'third_party/**') }}

      - name: Build native capture engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        run: npm run build:engine

      - name: Stage Tauri sidecars
        run: npm run stage:tauri

      - name: Verify pinned FFmpeg
        run: node scripts/release/test-ffmpeg-pin.cjs

      - name: Compute native compatibility identity
        shell: pwsh
        run: |
          $identity = node scripts/release/native-identity.cjs
          if ($LASTEXITCODE -ne 0 -or $identity -notmatch '^[a-f0-9]{64}$') { throw "Native identity generation failed" }
          "CLIPTURE_NATIVE_ID=$identity" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Windows code signing
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
          WINDOWS_SIGN_INSTALL: ${{ vars.WINDOWS_SIGN_INSTALL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_COMMAND)) {
            "config_arg=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          if ($env:WINDOWS_SIGN_COMMAND -notmatch '%1') { throw "WINDOWS_SIGN_COMMAND must contain %1 for the file to sign." }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_INSTALL)) {
            Invoke-Expression $env:WINDOWS_SIGN_INSTALL
            if ($LASTEXITCODE -ne 0) { throw "Signing tool installation failed." }
          }
          @{ bundle = @{ windows = @{ signCommand = $env:WINDOWS_SIGN_COMMAND } } } | ConvertTo-Json -Depth 4 |
            Out-File -FilePath src-tauri/tauri.signing.conf.json -Encoding utf8
          "config_arg=--config src-tauri/tauri.signing.conf.json" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The installer folder must hold this build's installer only. Caches
      # saved before their exclusion worked still carry an older one.
      - name: Clear earlier installer output
        shell: pwsh
        run: Remove-Item -Recurse -Force src-tauri/target/x86_64-pc-windows-msvc/release/bundle -ErrorAction SilentlyContinue

      - name: Build the signed release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.release.conf.json ${{ steps.signing.outputs.config_arg }}

      # Everything release.yml needs from a build, at its usual paths.
      - name: Keep the release build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/clipture.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            src-tauri/binaries/
            dist/renderer/
          if-no-files-found: error
          retention-days: 14
