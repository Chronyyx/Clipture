name: CI

# Tests every push to main, and keeps the build caches warm for releases.
# GitHub lets a tag's workflow restore caches only from that tag or the
# default branch, so caches saved by release tags were never reused and each
# release compiled everything from scratch. Caches saved here, on main, are
# what release builds restore. Job names, toolchain, environment and the
# build command mirror release.yml so the cache keys and contents match.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "engine/**"
      - "third_party/**"
      - "src/**"
      - "tools/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keyed on the engine's own sources: a release whose engine sources
      # match reuses this tested build instead of compiling it again.
      - name: Reuse an engine built from these sources
        id: engine_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/engine/Release/clipture_engine.exe
          key: engine-${{ runner.os }}-${{ hashFiles('engine/**', 'third_party/**') }}

      - name: Build native capture engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        run: npm run build:engine

      - name: Test native capture engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        run: ctest --test-dir build/engine -C Release --output-on-failure

      - name: Hand the engine to the later jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipture-engine
          path: build/engine/Release/clipture_engine.exe
          if-no-files-found: error
          retention-days: 1

  rust-tests:
    needs: engine
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> src-tauri/target
          shared-key: rust-tests

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Get the capture engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clipture-engine
          path: build/engine/Release

      - name: Stage Tauri sidecars
        run: npm run stage:tauri

      - name: Test migration contracts
        run: |
          node scripts/migration/test-host-contract.cjs
          node scripts/migration/test-renderer-boundaries.cjs
          node scripts/migration/test-ui-process-boundaries.cjs
          node scripts/migration/test-save-result-contract.cjs
          node scripts/testing/test-tauri-workflow.cjs
          node scripts/migration/test-frame-diagnostics-parity.cjs
          node scripts/testing/test-library-snapshot.cjs
          node scripts/release/test-electron-bridge.cjs
          node scripts/release/test-production-key.cjs
          node scripts/release/test-runtime-manifest.cjs
          node scripts/release/test-installer-template.cjs
          node scripts/release/test-windows-runtime-imports.cjs

      - name: Test Rust host
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Test patch tool
        run: cargo test --locked --manifest-path tools/make-patches/Cargo.toml

  # Compiles exactly what a release compiles, without bundling or signing,
  # so the release job finds its dependencies already built.
  release-build:
    needs: engine
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> src-tauri/target
          shared-key: release-windows-x64

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Get the capture engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clipture-engine
          path: build/engine/Release

      - name: Stage Tauri sidecars
        run: npm run stage:tauri

      - name: Build the release configuration
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --no-bundle --config src-tauri/tauri.release.conf.json

      - name: Build patch tool
        run: cargo build --locked --release --manifest-path tools/make-patches/Cargo.toml
