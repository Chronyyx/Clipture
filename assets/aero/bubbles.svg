<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <!-- Soap bubbles over the Aero wallpaper, drawn in the wallpaper's
       16:9 frame (and scaled with it) but kept as vectors so they stay
       sharp. Each is a clear film: almost nothing in the middle, a thin
       iridescent rim, the window of light it reflects at the top left, a
       glint, and light caught again along its lower edge. -->
  <defs>
    <radialGradient id="film" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.84" stop-color="#d8f4ff" stop-opacity="0.1"/>
      <stop offset="0.95" stop-color="#e8faff" stop-opacity="0.38"/>
      <stop offset="0.99" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ad9"/>
      <stop offset="0.18" stop-color="#ffd27a"/>
      <stop offset="0.36" stop-color="#fff58a"/>
      <stop offset="0.52" stop-color="#7affb4"/>
      <stop offset="0.7" stop-color="#6fe2ff"/>
      <stop offset="0.86" stop-color="#9c8cff"/>
      <stop offset="1" stop-color="#ff8ad6"/>
    </linearGradient>
    <linearGradient id="rainbowTurned" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe2ff"/>
      <stop offset="0.3" stop-color="#ff9ae0"/>
      <stop offset="0.6" stop-color="#fff58a"/>
      <stop offset="1" stop-color="#7affb4"/>
    </linearGradient>
    <radialGradient id="caught" cx="0.62" cy="0.82" r="0.42">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky" cx="0.5" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#bfe8ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#bfe8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grassReflection" cx="0.5" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#9ff5ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9ff5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="-83" y1="-30" x2="15" y2="-87" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="window-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <!-- One bubble of radius 100 at the origin. -->
    <g id="bubble">
      <circle r="100" fill="url(#film)"/>
      <circle r="100" fill="url(#sky)"/>
      <circle r="100" fill="url(#grassReflection)"/>
      <circle r="96.5" fill="none" stroke="url(#rainbow)" stroke-width="5" opacity="0.55" filter="url(#soft)"/>
      <circle r="90" fill="none" stroke="url(#rainbowTurned)" stroke-width="3" opacity="0.28" filter="url(#soft)"/>
      <circle r="99.2" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      <!-- Light caught along the lower right edge. -->
      <path d="M 82 52 A 97 97 0 0 1 -30 92 A 104 104 0 0 0 78 44 Z" fill="#ffffff" opacity="0.55" filter="url(#soft)"/>
      <circle r="100" fill="url(#caught)" opacity="0.5"/>
      <!-- The light it reflects: one curved crescent at the top left,
           fading along its length. -->
      <path d="M -82.7 -30.1 A 88 88 0 0 1 15.3 -86.7 L 13.2 -74.8 A 76 76 0 0 0 -71.4 -26 Z" fill="url(#window)" filter="url(#window-blur)"/>
      <!-- A soft glint, and a fainter one opposite. -->
      <ellipse cx="-58" cy="-46" rx="7" ry="4" transform="rotate(-52 -58 -46)" fill="#ffffff" opacity="0.9" filter="url(#soft)"/>
      <ellipse cx="62" cy="58" rx="6" ry="3" transform="rotate(-48 62 58)" fill="#ffffff" opacity="0.55" filter="url(#soft)"/>
    </g>
  </defs>

  <use href="#bubble" transform="translate(250 170) scale(1.25)"/>
  <use href="#bubble" transform="translate(1735 560) scale(0.86)"/>
  <use href="#bubble" transform="translate(1525 840) scale(0.5)"/>
  <use href="#bubble" transform="translate(1835 790) scale(0.32)"/>
  <use href="#bubble" transform="translate(150 820) scale(0.58)"/>
  <use href="#bubble" transform="translate(1045 120) scale(0.34)"/>
  <use href="#bubble" transform="translate(640 950) scale(0.24)"/>
</svg>
