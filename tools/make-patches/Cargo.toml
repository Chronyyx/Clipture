[package]
name = "make-patches"
version = "0.1.0"
description = "Release tool: zstd patches from earlier Clipture releases (ADR 0020)"
edition = "2021"
publish = false

# Standalone so release CI builds it in seconds instead of rebuilding the app.
# zstd is pinned to the exact version src-tauri decodes with; the shared
# fixture in fixtures/ fails both crates' tests if the two drift apart.
[dependencies]
zstd = { version = "=0.13.3", default-features = false }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
